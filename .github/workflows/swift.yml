# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: xcodebuild -project "知乎日报-SwiftUI.xcodeproj" -scheme "DailyReader" -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO build
    - name: Run tests
      run: xcodebuild -project "知乎日报-SwiftUI.xcodeproj" -scheme "DailyReader" -destination "platform=iOS Simulator,name=iPhone 16" test
